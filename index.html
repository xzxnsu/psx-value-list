<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Simulator Value List</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #00ff88; }
        .search-bar { width: 100%; max-width: 600px; display: block; margin: 0 auto 30px auto; padding: 15px; border-radius: 8px; border: 1px solid #333; font-size: 16px; background-color: #1e1e1e; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 12px; padding: 20px; text-align: center; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: #00ff88; }
        .card img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 15px; border-radius: 8px; }
        .card h3 { font-size: 18px; margin-bottom: 10px; }
        .price { font-size: 20px; font-weight: bold; color: #00ff88; margin-bottom: 5px; }
        .demand { font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <h1>Pet Simulator Value List</h1>
    <input type="text" id="searchInput" class="search-bar" placeholder="Szukaj peta po nazwie..." onkeyup="filterPets()">

    <div class="grid" id="petsGrid">Ładowanie petów...</div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRt1mqDC-jktFw6eepQKTStgEr5SblZYAE4j-DkJhFYZS90QoSb3LULmQRiv_SIuLh7w2bRHOD7VMc6/pub?output=csv';
        let petsData = [];

        async function loadPets() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                
                petsData = rows.map(row => {
                    const columns = row.split(',');
                    return {
                        nazwa: columns[0]?.trim(),
                        wartosc: columns[1]?.trim(),
                        popyt: columns[2]?.trim(),
                        obrazek: columns[3]?.trim()
                    };
                }).filter(pet => pet.nazwa);

                renderPets(petsData);
            } catch (error) {
                document.getElementById('petsGrid').innerText = 'Błąd podczas ładowania danych.';
            }
        }

        function renderPets(pets) {
            const grid = document.getElementById('petsGrid');
            if (pets.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Nie znaleziono petów.</p>';
                return;
            }
            grid.innerHTML = pets.map(pet => `
                <div class="card">
                    <img src="${pet.obrazek || 'https://via.placeholder.com/120'}" alt="${pet.nazwa}">
                    <h3>${pet.nazwa}</h3>
                    <div class="price">💎 ${pet.wartosc}</div>
                    <div class="demand">Popyt: ${pet.popyt}</div>
                </div>
            `).join('');
        }

        function filterPets() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = petsData.filter(pet => pet.nazwa.toLowerCase().includes(query));
            renderPets(filtered);
        }

        loadPets();
    </script>
</body>
</html>

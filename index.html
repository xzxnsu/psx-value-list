<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Simulator Value List</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; color: #00ff88; }
    .search-bar { width: 100%; max-width: 500px; display: block; margin: 0 auto 30px auto; padding: 12px 20px; font-size: 16px; border-radius: 8px; border: 1px solid #333; background-color: #1e1e1e; color: #fff; outline: none; }
    .search-bar:focus { border-color: #00ff88; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 15px; text-align: center; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-5px); border-color: #00ff88; }
    .card img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 10px; }
    .card h3 { font-size: 18px; margin-bottom: 10px; color: #fff; }
    .values { display: flex; flex-direction: column; gap: 4px; font-size: 14px; margin-bottom: 10px; text-align: left; background: #161616; padding: 8px; border-radius: 6px; }
    .val-normal { color: #e0e0e0; }
    .val-golden { color: #ffd700; font-weight: bold; }
    .val-rainbow { color: #ff69b4; font-weight: bold; }
    .demand { font-size: 12px; color: #aaa; text-align: right; }
  </style>
</head>
<body>

  <h1>Pet Simulator Value List</h1>
  <input type="text" id="searchInput" class="search-bar" placeholder="Szukaj peta po nazwie..." onkeyup="filterPets()">

  <div class="grid" id="petsGrid">Ładowanie petów...</div>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSnmO_rc8kXxs_4iMapDs_E9jt2M3L5E5-rkCTUB8QpjFEAgf2UMZ7-oOwKu-tAw5Vn9wGs0ESupocu/pub?gid=1906087270&single=true&output=csv';
    let petsData = [];

    function parseCSVLine(text) {
      let regex = /(?!\s*$)\s*(?:'([^'\\]*(?:\\[\s\S][^'\\]*)*)'|"([^"\\]*(?:\\[\s\S][^"\\]*)*)"|([^,'"\s\\]*(?:\s+[^,'"\s\\]+)*))\s*(?:,|$)/g;
      let arr = [];
      text.replace(regex, function(m0, m1, m2, m3) {
        if (m1 !== undefined) arr.push(m1.replace(/\\'/g, "'"));
        else if (m2 !== undefined) arr.push(m2.replace(/\\"/g, '"'));
        else if (m3 !== undefined) arr.push(m3);
        return '';
      });
      return arr;
    }

    async function loadPets() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const data = await response.text();
        const rows = data.split('\n').slice(1);

        petsData = rows.map(row => {
          const columns = parseCSVLine(row);
          return {
            nazwa: columns[0]?.trim() || '',
            normal: columns[1]?.trim() || 'N/A',
            golden: columns[2]?.trim() || 'N/A',
            rainbow: columns[3]?.trim() || 'N/A',
            popyt: columns[4]?.trim() || 'N/A',
            obrazek: columns[5]?.trim() || ''
          };
        }).filter(pet => pet.nazwa.length > 0);

        renderPets(petsData);
      } catch (error) {
        document.getElementById('petsGrid').innerHTML = 'Błąd podczas ładowania danych.';
      }
    }

    function renderPets(pets) {
      const grid = document.getElementById('petsGrid');
      grid.innerHTML = '';

      pets.forEach(pet => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${pet.obrazek}" alt="${pet.nazwa}" onerror="this.src='https://via.placeholder.com/100?text=No+Image'">
          <h3>${pet.nazwa}</h3>
          <div class="values">
            <div class="val-normal">⚪ Normal: ${pet.normal}</div>
            <div class="val-golden">🟡 Golden: ${pet.golden}</div>
            <div class="val-rainbow">🌈 Rainbow: ${pet.rainbow}</div>
          </div>
          <div class="demand">Demand: ${pet.popyt}</div>
        `;
        grid.appendChild(card);
      });
    }

    function filterPets() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = petsData.filter(pet => pet.nazwa.toLowerCase().includes(query));
      renderPets(filtered);
    }

    loadPets();
  </script>
</body>
</html>
